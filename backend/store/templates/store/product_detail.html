<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }} | My Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: #111827;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .product-image img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 15px;
        }

        .product-info h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin: 20px 0;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: #111827;
            color: white;
            padding: 13px 22px;
            border-radius: 8px;
            text-decoration: none;
            margin-right: 10px;
        }

        .btn:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: white;
            margin-top: 50px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
                margin: 20px;
            }

            .product-info h1 {
                font-size: 28px;
            }

            nav {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>🛍️ My Store</h2>

        <div>
            <a href="{% url 'product_list' %}">Home</a>
            <a href="{% url 'cart' %}">🛒 Cart</a>

            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">

        <div class="product-image">

            {% if product.image %}
                <img src="{{ product.image }}" alt="{{ product.name }}">
            {% endif %}

        </div>

        <div class="product-info">

            <h1>{{ product.name }}</h1>

            <p class="description">
                {{ product.description }}
            </p>

            <p class="price">
                ₹{{ product.price }}
            </p>

            <a class="btn"
               href="{% url 'add_to_cart' product.id %}">
                🛒 Add to Cart
            </a>

            <a class="btn"
               href="{% url 'product_list' %}">
                ← Back to Store
            </a>

        </div>

    </div>

    <footer>
        <p>© 2026 My Store | E-Commerce Project</p>
    </footer>

</body>
</html>
