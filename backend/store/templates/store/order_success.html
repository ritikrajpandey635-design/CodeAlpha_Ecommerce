<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful | My Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-box {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 45px 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .message {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .order-info {
            background: #f5f7fb;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .order-info p {
            margin: 8px 0;
        }

        .btn {
            display: inline-block;
            background: #111827;
            color: white;
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 8px;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="icon">🎉</div>

        <h1>Order Placed Successfully!</h1>

        <p class="message">
            Thank you for your order. Your purchase has been
            successfully confirmed.
        </p>

        <div class="order-info">

            <p>
                <strong>Order ID:</strong>
                #{{ order.id }}
            </p>

            <p>
                <strong>Total Amount:</strong>
                ₹{{ order.total_amount|floatformat:2 }}
            </p>

        </div>

        <a class="btn" href="{% url 'product_list' %}">
            Continue Shopping 🛍️
        </a>

    </div>

</body>
</html>
